<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>タスクボード プロトタイプ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">HTML / CSS / JavaScript prototype</p>
        <h1 id="board-title">タスクボード</h1>
        <p class="subtitle">リストとカードを使った、単一利用者向けのタスク管理プロトタイプ</p>
      </header>

      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>

      <section class="board" aria-label="タスクボード">
        <div id="lists" class="lists" aria-live="polite"></div>
        <form id="add-list-form" class="add-list-form">
          <label for="new-list-title">新しいリスト</label>
          <div class="form-row">
            <input id="new-list-title" name="title" type="text" maxlength="80" placeholder="例：未着手" autocomplete="off" />
            <button type="submit">リストを追加</button>
          </div>
          <p class="field-hint">空白だけの名前は登録できません。</p>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
