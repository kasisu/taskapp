<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>タスクボード</title><link rel="stylesheet" href="trello-mockup.css"></head><body>
<header class="top"><b>Taskflow</b><button>ボード</button><span></span><button>⌕</button><button>♧</button><button class="avatar">M</button></header>
<main><header class="board-head"><h1 id="title">タスクボード</h1><button>非公開</button><button>共有</button><button>•••</button></header><p id="status" role="status"></p><section id="lists" class="lists"></section></main>
<dialog id="detail"><form id="detail-form" method="dialog"><header><h2>カード詳細</h2><button value="cancel">×</button></header><input name="listId" type="hidden"><input name="cardId" type="hidden"><label>カード名<input name="title" required></label><div class="row"><label>優先度<select name="priority"><option value="unset">未設定</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select></label><label>期限日時<input name="dueAt" type="datetime-local"></label></div><label>詳細<textarea name="description" rows="5"></textarea></label><button class="primary" value="save">保存</button></form><section class="comments"><h3>コメント</h3><div id="comment-list"></div><form id="comment-form"><textarea name="text" rows="3" placeholder="コメントを記入"></textarea><p class="error"></p><button class="primary">コメントを追加</button></form></section></dialog>
<dialog id="confirm"><form method="dialog"><h2>削除の確認</h2><p id="confirm-message"></p><button value="cancel">取り消す</button><button class="danger" value="confirm">削除する</button></form></dialog><script src="trello-mockup.js"></script></body></html>
